<!doctype html>
<html><head><meta charset="utf-8"><title>AD draft – Dota Caster Kit</title>
<link rel="stylesheet" href="/shared/base.css">
<style>
.stage { padding: 48px 64px; gap: 26px; }
.topbar .logo { height: 80px; }
.side { display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
.side .sh { display: flex; align-items: center; gap: 16px; font-size: 30px; }
.side .sh .tlogo { width: 52px; height: 52px; }
.cards { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
.card { display: flex; flex-direction: column; overflow: hidden; }
.card .pic { position: relative; height: 150px; background: var(--panel-2); }
.card .pic img { width: 100%; height: 100%; object-fit: cover; }
.card .pic .q { position: absolute; inset: 0; display: grid; place-items: center; font-size: 60px; color: var(--muted); font-family: var(--font-head); }
.card .nm { padding: 12px 16px 4px; font-size: 25px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .hn { padding: 0 16px; font-size: 17px; color: var(--muted); min-height: 22px; }
.card .ab { display: flex; gap: 8px; padding: 12px 16px 16px; }
.card .ab .s { width: 62px; height: 62px; border-radius: 8px; border: 2px dashed var(--line); overflow: hidden; display: grid; place-items: center; }
.card .ab .s.on { border: 2px solid var(--line); animation: pop .4s ease; }
.card .ab .s.ult { border-color: var(--win); }
.card .ab .s img { width: 100%; height: 100%; object-fit: cover; }
.card .ab .s.ult:not(.on)::after { content: "ULT"; font-size: 13px; color: var(--win); letter-spacing: .1em; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.wait { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; color: var(--muted); font-size: 22px; }
</style></head>
<body>
<div class="backdrop"></div>
<div class="stage" id="root"></div>
<div class="wait hidden" id="wait">Waiting for Ability Draft Plus… (AD mode needs the AD+ app running)</div>
<script src="/shared/kit.js"></script>
<script>
// Ability Draft board – drafted abilities per player, live from Ability Draft Plus (AD+).
const { esc, img, hero, ability, teamLogo } = KIT;
const root = document.getElementById("root");
let last = "";
async function tick() {
  if (!KIT.state) return;
  let d; try { d = await KIT.get("/api/draft"); } catch { return; }
  document.getElementById("wait").classList.toggle("hidden", d.connected && d.players.length);
  const st = KIT.state, key = JSON.stringify([d, st.match, KIT.assets, st.tournament]);
  if (key === last) return; last = key;
  const players = d.players.length ? d.players : Array.from({ length: 10 }, (_, i) => ({ index: i, team: i < 5 ? "radiant" : "dire", picks: [] }));
  const side = s => { const t = d.teams[s] || { name: s === "radiant" ? "Radiant" : "Dire" };
    return `<div class="side ${s === "radiant" ? "rad" : "dir"}"><div class="sh head">${teamLogo(t)}<span>${esc(t.name)}</span><span class="muted" style="font-size:20px">${s}</span></div>
      <div class="cards">${players.filter(p => p.team === s).map(card).join("")}</div></div>`; };
  root.innerHTML = `<div class="topbar panel">${KIT.logo()}<div><div class="tname head">${esc(st.tournament.name)}</div><div class="sub">${esc([st.match.round, "Ability Draft"].filter(Boolean).join(" · "))}</div></div></div>${side("radiant")}${side("dire")}`;
}
function card(p) {
  const picks = [0, 1, 2, 3].map(i => (p.picks || [])[i] || null);
  return `<div class="card panel side-bar"><div class="pic">${p.hero ? img(hero(p.hero)) : `<span class="q">?</span>`}</div>
    <div class="nm">${esc(p.name || "Player " + (p.index + 1))}</div><div class="hn">${esc(p.heroName || "")}</div>
    <div class="ab">${picks.map((a, i) => `<div class="s ${a ? "on" : ""} ${i === 3 ? "ult" : ""}" title="${esc(a && a.displayName)}">${a ? `<img src="${ability(a.name)}" alt="" onerror="this.remove()">` : ""}</div>`).join("")}</div></div>`;
}
setInterval(tick, 1000); KIT.on("state", tick);
</script>
</body></html>

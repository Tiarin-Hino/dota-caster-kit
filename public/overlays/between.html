<!doctype html>
<html><head><meta charset="utf-8"><title>Between games – Dota Caster Kit</title>
<link rel="stylesheet" href="/shared/base.css">
<style>
.stage { padding: 56px 72px; gap: 34px; }
.top { display: flex; align-items: center; gap: 28px; height: 120px; }
.top .logo { height: 120px; max-width: 420px; object-fit: contain; }
.top .tn { font-size: 46px; } .top .tg { font-size: 24px; color: var(--muted); margin-top: 4px; }
.main { flex: 1; display: grid; grid-template-columns: 640px 1fr; gap: 40px; min-height: 0; }
.main.noreel { grid-template-columns: 1fr; }
.next { padding: 40px 44px; display: flex; flex-direction: column; gap: 30px; justify-content: center; }
.next .lbl { font-size: 26px; color: var(--accent); }
.vs { display: flex; flex-direction: column; gap: 22px; }
.vs .t { display: grid; grid-template-columns: 120px 1fr auto; gap: 24px; align-items: center; }
.vs .t .tlogo { width: 120px; height: 120px; font-size: 30px; }
.vs .t .n { font-size: 46px; line-height: 1.05; }
.vs .t .s { font-size: 72px; }
.vs .x { font-size: 24px; color: var(--muted); padding-left: 144px; }
.meta { display: flex; gap: 14px; flex-wrap: wrap; }
.big { font-size: 64px; line-height: 1; }
.noreel .next { align-items: center; text-align: center; }
.noreel .vs { flex-direction: row; align-items: center; gap: 60px; }
.noreel .vs .t { grid-template-columns: 1fr; justify-items: center; text-align: center; }
.noreel .vs .t .tlogo { width: 220px; height: 220px; font-size: 48px; }
.noreel .vs .x { padding: 0; font-size: 40px; }
.noreel .meta { justify-content: center; }
.reel { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.reel .rh { display: flex; align-items: center; gap: 16px; font-size: 28px; }
.reel .rh .grow { flex: 1; } .reel .rh .c { font-size: 20px; color: var(--muted); }
.frame { position: relative; flex: 1; overflow: hidden; padding: 0; }
.frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius); background: #000; }
.frame .cap { position: absolute; left: 24px; bottom: 24px; padding: 10px 20px; background: var(--panel); border: var(--border); border-radius: var(--radius); font-size: 28px; }
.frame .cap:empty { display: none; }
</style></head>
<body>
<div class="backdrop"></div>
<div class="stage">
  <div class="top fade-in" id="top"></div>
  <div class="main" id="main">
    <div class="next panel fade-in" id="next"></div>
    <div class="reel" id="reel"><div class="rh head"><span>Highlights</span><span class="grow"></span><span class="c num" id="cnt"></span></div>
      <div class="frame panel"><video id="v" muted playsinline></video><div class="cap head" id="cap"></div></div></div>
  </div>
</div>
<script src="/shared/kit.js"></script>
<script>
// "Up next" + highlight reel. The reel loops this game's highlights (auto-captured and the ones you replayed).
//   ?reel=0  hide the reel   ?sound=1 keep clip audio
const { esc, teamLogo } = KIT;
const v = document.getElementById("v"), cap = document.getElementById("cap");
if (KIT.qs.get("sound") === "1") v.muted = false;
let reel = [], idx = -1, reelKey = "";

KIT.on("state", st => {
  const m = st.match, a = m.teamA, b = m.teamB, sc = m.score;
  document.getElementById("top").innerHTML = `${KIT.logo()}<div><div class="tn head">${esc(st.tournament.name)}</div><div class="tg">${esc(st.tournament.tagline || "")}</div></div>`;
  const over = !!m.result, gameNo = over ? m.games.length : m.game, decider = !over && m.bo > 1 && m.bo % 2 === 1 && sc.a === m.need - 1 && sc.b === m.need - 1;
  const t = (x, s) => `<div class="t">${teamLogo(x)}<div class="n head">${esc(x && x.name)}</div>${m.bo > 1 ? `<div class="s head num">${s}</div>` : ""}</div>`;
  document.getElementById("next").innerHTML = `<div class="lbl head">${over ? "Series result" : "Up next"}</div>
    <div class="vs">${t(a, sc.a)}<div class="x head">vs</div>${t(b, sc.b)}</div>
    <div class="meta">${m.round ? `<span class="pill">${esc(m.round)}</span>` : ""}<span class="pill">Best of ${m.bo}</span>${over ? "" : `<span class="pill">${decider ? "Decider" : "Game " + gameNo}</span>`}</div>
    <div class="big head">${esc(over ? (m.result === "draw" ? "Draw" : `${(m.result === "a" ? a : b).name} win`) : st.betweenText || "")}</div>`;
  const clips = KIT.qs.get("reel") === "0" ? [] : st.reel.filter(c => c.playable);
  document.getElementById("main").classList.toggle("noreel", !clips.length);
  document.getElementById("reel").classList.toggle("hidden", !clips.length);
  const k = clips.map(c => c.id + c.fromEnd + c.label).join();
  if (k !== reelKey) { reelKey = k; reel = clips; if (!clips.length) v.pause(); else if (v.paused || idx >= reel.length) { idx = -1; playNext(); } }
});
function playNext() {
  if (!reel.length) return;
  idx = (idx + 1) % reel.length; const c = reel[idx];
  document.getElementById("cnt").textContent = `${idx + 1} / ${reel.length}`;
  cap.textContent = c.label || "";
  v.src = c.url;
  v.onloadedmetadata = () => { if (c.fromEnd && isFinite(v.duration)) v.currentTime = Math.max(0, v.duration - c.fromEnd / 1000); v.play().catch(() => {}); };
}
v.addEventListener("ended", playNext);
v.addEventListener("error", () => setTimeout(playNext, 1000));
</script>
</body></html>
